schema_version: audiollm.experiment_group.v1
group_id: qwen3omni-standalone-promptcontext-20260923
title: Qwen3-Omni-30B-A3B Thinker standalone audio cells under the prompt-context likelihood recipe
research_question: >-
  How does the Qwen3-Omni-30B-A3B Thinker perform on the standalone audio-only and
  audio+text cells of D3TEC, Androids Interview, CMDC and Turkish pooled t17 under
  the versioned prompt-context recipe and the canonical candidate-label likelihood
  evaluation, and how do those rows compare with the matching Qwen2-Audio canonical
  likelihood references on the same dataset recipe, folds, evaluation view and
  aggregation? The DAIC audio-only and audio+text cells of the same campaign were
  produced and validated by PR #261; they are carried into the campaign comparison
  without being rerun.
dataset: multi_dataset
baseline: >-
  The PR #255 derived canonical likelihood values of the matching Qwen2-Audio
  harmonized runs, re-read and hash-verified at report time from
  outputs/experiment_reports/likelihood_canonical_values/derived_values.json, whose
  entries name the sha256 of every per-subject prediction file they were derived
  from: D3TEC audio_only macro-F1 0.618056 / audio_text 0.540198; Androids Interview
  audio_only 0.862800 / audio_text 0.856965; CMDC audio_only 0.951555 / audio_text
  0.970000; Turkish pooled t17 native audio_only 0.408934 / audio_text 0.687717; DAIC
  (PR #261 context rows, official test) audio_only 0.539216 / audio_text 0.735279.
  Those rows carry the older, pre-prompt-context prompt and were derived from the
  teacher-forced runs' saved per-subject candidate scores (argmax of the mean dep/non
  score per subject; the pooled text cells use the locked pair-margin rule), so they
  must be labelled exactly as derived likelihood references and must never be
  described as new standalone likelihood evaluations. Shared identity for the DAIC
  rows: manifest sha256 72e2dd204b915ccba3ebf922f030531fe5678b3ea8c9c52b81b41242fe9dda17
  and split metadata sha256 441333e0c88845eeacba9ea5355a8920cdd1f70e8cf7a7c15b9547b46da51473.
  A row whose dataset recipe, fold set, evaluation view, aggregation or backend cannot
  be confirmed is left blank with the reason instead of being inferred.
treatment: >-
  Eight production cells from eight configs (six canonical Qwen3-Omni
  promptcontext_v1 configs from PR #262, used directly, plus the two Turkish pooled
  Omni configs generated by scripts/build_qwen3omni_daic_configs.py):
  Qwen3-Omni-30B-A3B-Instruct loaded as the Thinker only
  (Qwen3OmniMoeThinkerForConditionalGeneration; the Talker is never built, saved or
  evaluated) in BF16 from the offline MN5 snapshot with sdpa attention, LoRA rank 16
  / alpha 32 anchored to the language-model decoder's attention projections plus the
  non-routed shared expert (routers and routed experts frozen), audio encoder frozen
  with no adapter and no projector training, FSDP training on two nodes of four H100s
  (world size 8, per-rank batch 1, accumulation 16, effective global batch 128),
  gradient checkpointing, CPU activation offload, the centralized promptcontext_v1
  prompt with each dataset's recording context, inner_val_macro_f1 checkpoint
  selection in mode max with the canonical early stopping and 20-epoch cap, best_model
  as the evaluated checkpoint, a separate standalone likelihood evaluation per fit
  (one process with a 4-GPU device map), and strict subject-level
  headline/binary_strict metrics with INVALID counted as wrong.
expected_seeds:
  - 1337
expected_folds:
  - 0
  - 1
  - 2
  - 3
  - 4
primary_metric:
  namespace: headline/binary_strict
  name: macro_f1
  backend: likelihood
  aggregation: subject_level
  evaluation_view: harmonized_all_windows_full_coverage
runs:
  - logical_run: qwen3omni_d3tec_audio_only_promptcontext
    dataset: d3tec
    modality: audio_only
    config: configs/main/d3tec_audio_only_harmonized_selmacrof1_likelihood_v1.yaml
    folds:
      - 0
      - 1
      - 2
      - 3
      - 4
    endpoint: outer_fold_test_partition
    folds_note: >-
      Five-fold CV (train_val_test); the headline is the unweighted mean of the five
      fold metrics over the outer test partitions.
  - logical_run: qwen3omni_d3tec_audio_text_promptcontext
    dataset: d3tec
    modality: audio_text
    config: configs/main/d3tec_audio_text_harmonized_selmacrof1_likelihood_v1.yaml
    folds:
      - 0
      - 1
      - 2
      - 3
      - 4
    endpoint: outer_fold_test_partition
    folds_note: >-
      Same manifest and split identity as the audio-only cell; the full participant
      transcript is attached to every audio window. Unweighted five-fold mean.
  - logical_run: qwen3omni_androids_audio_only_promptcontext
    dataset: androids_interview
    modality: audio_only
    config: configs/main/androids_audio_only_harmonized_selmacrof1_likelihood_v1.yaml
    folds:
      - 0
      - 1
      - 2
      - 3
      - 4
    endpoint: outer_fold_test_partition
    folds_note: >-
      Five-fold CV (train_val_test); the headline is the unweighted mean of the five
      fold metrics over the outer test partitions.
  - logical_run: qwen3omni_androids_audio_text_promptcontext
    dataset: androids_interview
    modality: audio_text
    config: configs/main/androids_audio_text_harmonized_selmacrof1_likelihood_v1.yaml
    folds:
      - 0
      - 1
      - 2
      - 3
      - 4
    endpoint: outer_fold_test_partition
    folds_note: >-
      Same manifest and split identity as the audio-only cell; the full subject
      transcript is attached to every audio window. Unweighted five-fold mean.
  - logical_run: qwen3omni_cmdc_audio_only_promptcontext
    dataset: cmdc
    modality: audio_only
    config: configs/main/cmdc_audio_only_harmonized_selmacrof1_likelihood_v1.yaml
    folds:
      - 0
      - 1
      - 2
      - 3
      - 4
    endpoint: selected_validation_view
    folds_note: >-
      Five-fold CV (train_val): the outer fold is both the selection and the reported
      partition, so this is a selected-validation five-fold mean, not a held-out test.
  - logical_run: qwen3omni_cmdc_audio_text_promptcontext
    dataset: cmdc
    modality: audio_text
    config: configs/main/cmdc_audio_text_harmonized_selmacrof1_likelihood_v1.yaml
    folds:
      - 0
      - 1
      - 2
      - 3
      - 4
    endpoint: selected_validation_view
    folds_note: >-
      Same manifest and split identity as the audio-only cell; the full subject
      transcript is attached to every audio window. Selected-validation five-fold mean.
  - logical_run: qwen3omni_turkish_pooled_audio_only_promptcontext
    dataset: turkish
    dataset_variant: pooled_t17
    modality: audio_only
    config: configs/main/turkish_pooled_t17_audio_only_harmonized_selmacrof1_likelihood_v1_qwen3asr_promptcontext_v1_qwen3omni_30b_a3b.yaml
    folds:
      - 0
      - 1
      - 2
      - 3
      - 4
    endpoint: selected_validation_view
    folds_note: >-
      Five-fold CV (train_val) over the prebuilt pooled folds. The leakage unit is the
      participant; both question conditions stay in the same subject fold; every natural
      -unit window carries its condition's question-context sentence. Response-subject
      mean aggregation over windows and source units, i.e. the source recipe's
      aggregation unchanged (the locked pair-margin rule is text-only and does not apply
      here). Selected-validation five-fold mean.
  - logical_run: qwen3omni_turkish_pooled_audio_text_promptcontext
    dataset: turkish
    dataset_variant: pooled_t17
    modality: audio_text
    config: configs/main/turkish_pooled_t17_audio_text_harmonized_selmacrof1_likelihood_v1_qwen3asr_promptcontext_v1_qwen3omni_30b_a3b.yaml
    folds:
      - 0
      - 1
      - 2
      - 3
      - 4
    endpoint: selected_validation_view
    folds_note: >-
      Same prebuilt manifest and pooled fold identity as the audio-only cell; the full
      subject transcript of both conditions is attached to every window under the
      source recipe's full_subject scope. Selected-validation five-fold mean.
prompt_contract:
  prompt_context_version: promptcontext_v1
  shared_instruction: the approved audio-bearing shared English instruction, used verbatim
  dataset_context_version: promptcontext_v1
  dataset_context_keys:
    d3tec: d3tec
    androids_interview: androids
    cmdc: cmdc
    turkish_pooled_t17: turkish_pooled
  question_context_version: promptcontext_v1
  question_context_scope: >-
    Selected by the Turkish pooled cells only; the canonical D3TEC, Androids and CMDC
    templates carry no question-context slot.
  modality_honest_rendering: >-
    Audio-only renders no transcript block; audio+text attaches the configured full
    participant or subject transcript to every audio window with no truncation. The
    prompt text lives only in src/data/prompt_context.py.
  label_contract: Depressed / Non-depressed (legacy_english_labels, unchanged)
model_contract:
  backend: qwen3omni
  trainable_class: Qwen3OmniMoeThinkerForConditionalGeneration
  model_path: /gpfs/projects/etur92/ozu647717/models/Qwen3-Omni-30B-A3B-Instruct
  precision: bf16 (no quantization)
  attention_implementation: sdpa (the offline MN5 wheelhouse has no flash-attn)
  training_strategy: fsdp
  training_shape: >-
    2 nodes x 4 H100s (world size 8, per-rank batch 1, accumulation 16 passed explicitly
    so it lands in provenance, effective global batch 128), activation offload cpu,
    gradient synchronization every microbatch
  evaluation_shape: >-
    1 node, 1 task, 4 H100s in one process with a device map (resources.eval_gpus_per_node
    declares it; the submit contract and the model loader resolve the same shape)
  lora_contract: >-
    Attention projections plus the non-routed shared expert of the 48 Thinker decoder layers;
    routers, routed experts, audio encoder, projector, embeddings and LM head stay frozen.
    The PR #261 model-load audit (matched 192 = expected 192, talker_parameters 0, 13,369,344
    trainable of 31,732,574,832 total) is re-recorded per run.
comparison_rule: >-
  One reader-facing row per dataset and modality per verified evaluation view. The Omni
  rows use promptcontext_v1 and the Qwen2-Audio references use the older inline prompt,
  so every difference is a model-plus-prompt difference and no isolated prompt or
  backbone effect is claimed. Likelihood and teacher-forced views never share a column;
  derived likelihood references are labelled as derived; D3TEC and Androids rows are
  outer-test five-fold means, CMDC and Turkish pooled are selected-validation five-fold
  means, and the DAIC rows stay official-test single results. Comparisons whose dataset
  recipe, fold set, view or aggregation differ are refused, and no significance is
  claimed without a prespecified test.
scope:
  campaign: promptcontext_v1_qwen3omni_likelihood
  checkpoint_role: best_model
  evaluation_jobs_per_fit: 1
  report_metrics:
    - macro_f1
    - positive_f1
    - uar
  storage_note: >-
    Checkpoints are LoRA adapters of a 30B Thinker; the base snapshot stays at
    /gpfs/projects/etur92/ozu647717/models/Qwen3-Omni-30B-A3B-Instruct.
exclusions:
  - omni_text_only_training
  - daic_retraining
  - merged_training
  - native_versus_english_comparison
  - translation
  - logreg_xgboost_optuna
  - teacher_forced_or_generation_evaluation
  - talker_loading_or_training
  - quantization
  - wandb_export
  - lora_target_comparison
  - unplanned_dataset_or_seed_expansion
  - PR_merge
github_issue: null
github_pr: null
