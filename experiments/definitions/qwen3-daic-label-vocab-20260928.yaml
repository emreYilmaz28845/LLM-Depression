schema_version: audiollm.experiment_group.v1
group_id: qwen3-daic-label-vocab-20260928
title: Qwen3 DAIC label-vocabulary campaign - five answer-label arms over three model/modality cells
research_question: >-
  On DAIC fold 0 (the fixed official test partition), with the likelihood backend,
  the promptcontext_v1 prompt and every other recipe element held fixed, how does the
  answer-label vocabulary change subject-level depression-classification performance?
  Five arms are trained: ab (A/B), 01 (1/0), truefalse (True/False), yesno (Yes/No) and
  en (Depressed/Non-depressed). Each arm runs over three cells - Qwen3.8-27B text-only,
  Qwen3-Omni Thinker audio-only, Qwen3-Omni Thinker audio+text - and three training
  seeds (7, 1337, 2024).
dataset: daic
baseline: >-
  Ordering within each cell is ab, 01, truefalse, yesno, en, and every contrast is a
  paired comparison between two arms of the same cell, training seed and fold over the
  same DAIC test subjects. Delta is always (later arm in the order) minus (earlier arm).
  There is no cross-cell and no cross-seed comparison, and no arm is a shared external
  reference. No historical Qwen2 run serves as an arm: all 45 production runs are newly
  trained under this campaign, and historical Qwen2 results stay historical context that
  never shares a comparison column with these results.
treatment: >-
  Fifteen configs under configs/labels/ named
  daic_<modality>_harmonized_selmacrof1_likelihood_<model>_<tag>_v1.yaml, for tag in
  {ab, 01, truefalse, yesno, en} and modality in {text_only, audio_only, audio_text}.
  Each config is the corresponding canonical DAIC config with only three changes: the
  labels block, recipe_id and output_dirs.run_root, so the answer-label vocabulary and
  its legend/instruction rendering is the only treatment difference between the arms of
  a cell. Training seed is a submission override and never part of the config diff.
expected_seeds:
  - 7
  - 1337
  - 2024
expected_folds:
  - 0
primary_metric:
  namespace: headline/binary_strict
  name: macro_f1
  backend: likelihood
  aggregation: subject_level
  evaluation_view: harmonized_all_windows_full_coverage
