    - {id: N06, recording_condition: negative_only, transcript_condition: not_applicable, modality: audio_only, backbone: gemma4, config: configs/main/turkish_negative_only_t17_audio_only_harmonized_selmacrof1_tf_qwen3asr_gemma4_12b.yaml}
