    - {id: N10, recording_condition: negative_only, transcript_condition: english, modality: audio_text, backbone: gemma4, config: configs/main/turkish_negative_only_t17_audio_text_harmonized_selmacrof1_tf_qwen3asr_en_gemma4_12b.yaml}
