schema_version: audiollm.experiment_group.v1
group_id: turkish-pos_only-vs-negonly-native-en-multimodal-heads-v1-20260903
title: Turkish positive-only versus negative-only multimodal comparison
research_question: >-
  Under the harmonized Turkish threshold-17 recipe, how does restricting the
  recordings to negative-question responses change teacher-forced and hidden-
  state depression classification for Qwen and Gemma 4 across audio-only,
  native-text, English-text, native audio+text, and English audio+text input?
dataset: turkish,turkish_negative_only_t17
baseline: positive-only Turkish recordings from the canonical threshold-17 dataset (question set 1)
treatment: negative-question-only Turkish recordings for the same 120 subjects and labels
expected_seeds:
  - 7
  - 1337
  - 2024
expected_folds:
  - 0
  - 1
  - 2
  - 3
  - 4
primary_metric:
  namespace: headline/binary_strict
  name: macro_f1
  backend: original_teacher_forced
  aggregation: fold_mean_subject_level
  evaluation_view: harmonized_all_windows_full_coverage
github_issue: null
github_pr: null
scope:
  population_subject_count: 120
  pos_only_selected_clip_count: 1051
  negative_only_selected_clip_count: 1170
  negative_only_excluded_wav_count: 145
  threshold: 17
  split_protocol: train_val
  split_seed: 1337
  audio_encoder: frozen
  checkpoint_role: best_model
  backbone_selection_metric: inner_val_macro_f1
  backbone_selection_mode: max
  evaluation_backend: original_teacher_forced
  evaluation_view: harmonized_all_windows_full_coverage
  aggregation: fold_mean_subject_level
  training_seeds:
    - 7
    - 1337
    - 2024
  heads:
    - teacher_forced
    - logreg
    - xgb_optuna100
  posthoc:
    logreg_seed: 1337
    xgb_completed_trials: 100
    xgb_inner_folds: 3
    xgb_sampler_seed: 1337
    xgb_model_seed: 1337
    xgb_inner_split_seed: 1337
    xgb_threshold: 0.5
    xgb_sampling_mode: none
  backbone_cells:
    - {id: P01, recording_condition: pos_only, transcript_condition: not_applicable, modality: audio_only, backbone: qwen, config: configs/main/turkish_pos_only_t17_audio_only_harmonized_selmacrof1_tf_qwen3asr.yaml}
    - {id: P02, recording_condition: pos_only, transcript_condition: native, modality: text_only, backbone: qwen, config: configs/main/turkish_pos_only_t17_text_only_harmonized_selmacrof1_tf_qwen3asr.yaml}
    - {id: P03, recording_condition: pos_only, transcript_condition: english, modality: text_only, backbone: qwen, config: configs/main/turkish_pos_only_t17_text_only_harmonized_selmacrof1_tf_qwen3asr_en.yaml}
    - {id: P04, recording_condition: pos_only, transcript_condition: native, modality: audio_text, backbone: qwen, config: configs/main/turkish_pos_only_t17_audio_text_harmonized_selmacrof1_tf_qwen3asr.yaml}
    - {id: P05, recording_condition: pos_only, transcript_condition: english, modality: audio_text, backbone: qwen, config: configs/main/turkish_pos_only_t17_audio_text_harmonized_selmacrof1_tf_qwen3asr_en.yaml}
    - {id: P06, recording_condition: pos_only, transcript_condition: not_applicable, modality: audio_only, backbone: gemma4, config: configs/main/turkish_pos_only_t17_audio_only_harmonized_selmacrof1_tf_qwen3asr_gemma4_12b.yaml}
    - {id: P07, recording_condition: pos_only, transcript_condition: native, modality: text_only, backbone: gemma4, config: configs/main/turkish_pos_only_t17_text_only_harmonized_selmacrof1_tf_qwen3asr_gemma4_12b.yaml}
    - {id: P08, recording_condition: pos_only, transcript_condition: english, modality: text_only, backbone: gemma4, config: configs/main/turkish_pos_only_t17_text_only_harmonized_selmacrof1_tf_qwen3asr_en_gemma4_12b.yaml}
    - {id: P09, recording_condition: pos_only, transcript_condition: native, modality: audio_text, backbone: gemma4, config: configs/main/turkish_pos_only_t17_audio_text_harmonized_selmacrof1_tf_qwen3asr_gemma4_12b.yaml}
    - {id: P10, recording_condition: pos_only, transcript_condition: english, modality: audio_text, backbone: gemma4, config: configs/main/turkish_pos_only_t17_audio_text_harmonized_selmacrof1_tf_qwen3asr_en_gemma4_12b.yaml}
    - {id: N01, recording_condition: negative_only, transcript_condition: not_applicable, modality: audio_only, backbone: qwen, config: configs/main/turkish_negative_only_t17_audio_only_harmonized_selmacrof1_tf_qwen3asr.yaml}
