schema_version: audiollm.significance_family.v1
declared: '2026-09-13'
alpha: 0.05
iterations: 10000
seed: 1337
metrics:
- macro_f1
- macro_recall
metric_notes:
  macro_f1: primary metric of the deck
  macro_recall: UAR (unweighted average recall = balanced accuracy)
tests:
  primary: paired_prediction_swap_permutation (two-sided, 10000 iterations, seed 1337)
  effect_size: stratified_paired_bootstrap (delta and 95% CI)
  binary_view: exact_mcnemar
  correction: holm within each block and metric
pairing: subject (subject_id); identical subject sets and labels required on both sides
aggregation: pooled out-of-fold subject predictions; the deck headline cells are unweighted fold means
excluded:
- 'Turkish standalone-versus-merged: standalone uses the pooled positive+negative-question input while the merged model used
  the positive-question-only input'
- 'Merged XGBoost: the merged optuna100 artifacts carry per-dataset metrics but no per-subject predictions'
- 'Literature rows: the compared papers publish no per-subject predictions'
- 'Cross-corpus comparisons: different subjects'
families:
- id: model_qwen_vs_gemma4_teacher_forced
  description: 'Headline route, native transcript: does one backbone beat the other on the same subjects?'
  comparisons:
  - id: D3TEC|A+T|Qwen vs Gemma 4
    dataset: d3tec
    description: 'D3TEC A+T: Qwen vs Gemma 4, teacher-forced, native transcript'
    baseline:
      kind: record
      dataset: d3tec
      modality: audio_text
      condition: native
      model: qwen
      route: teacher_forced
    comparison:
      kind: record
      dataset: d3tec
