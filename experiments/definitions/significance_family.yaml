schema_version: audiollm.significance_family.v1
analysis_status: retrospective_exploratory
frozen_for_final_rerun: '2026-09-13'
alpha: 0.05
iterations: 1000000
max_iterations: 10000000
bootstrap_iterations: 100000
seed: 1337
metrics:
- macro_f1
- positive_f1
- macro_recall
metric_notes:
  macro_f1: single primary metric
  positive_f1: supporting effect-size metric; Depressed is positive
  macro_recall: supporting UAR effect-size metric (unweighted average recall = balanced accuracy)
tests:
  metric_primary: paired_prediction_swap_permutation (two-sided; exact for single-seed binary predictions)
  effect_size: observed comparison-minus-baseline delta with unadjusted subject-cluster bootstrap 95% CI
  mcnemar_primary: exact_mcnemar correctness view
  correction: Macro-F1 Holm within pre-specified scientific contrast families; McNemar corrected separately within the same families; broad joint-block and global Holm retained as conservative sensitivity views
family_contract:
  F1_backbone: dataset x fixed prediction route x fixed transcript condition; available modalities are members
  F2_translation: dataset x backbone x prediction route; Text and Audio+Text are members when available
  F3_route: dataset x modality x backbone x transcript condition; available route pairs are members
  F4_training_regime: dataset x modality x backbone x prediction route; one standalone-vs-merged comparison is normally a singleton
  F5_recipe: modality x backbone x prediction method; available DAIC recipe pairs are members
  metric_rule: Macro-F1, Positive-F1, and UAR are corrected separately using identical family membership
  test_rule: paired prediction-swap and McNemar corrections are separate
pairing: subject (subject_id); identical subject sets and labels required on both sides
aggregation: pooled out-of-fold subject predictions; the deck headline cells are unweighted fold means
excluded:
- 'Turkish standalone-versus-merged: standalone uses the pooled positive+negative-question input while the merged model used
  the positive-question-only input'
- 'Merged XGBoost: the merged optuna100 artifacts carry per-dataset metrics but no per-subject predictions'
- 'Literature rows: the compared papers publish no per-subject predictions'
- 'Cross-corpus comparisons: different subjects'
generated_families:
- id: model_qwen_vs_gemma4_hidden_routes
  kind: backbone_same_route
  description: Same native corpus, input, and hidden-head route; backbone changes.
  datasets: [d3tec, androids_interview, cmdc, turkish, daic]
  modalities: [audio_text, audio_only, text_only]
  routes: [logreg, xgb_optuna100]
  condition: native
- id: native_vs_english_hidden_heads_three_seed
  kind: native_en_hidden_heads
  description: Standalone, merged-CV, and final-test three-seed hidden-head comparisons shown in the deck.
