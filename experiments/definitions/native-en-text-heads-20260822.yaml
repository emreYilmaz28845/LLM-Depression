schema_version: audiollm.experiment_group.v1
group_id: native-en-text-heads-20260822
title: Text-only native versus English transcripts with LogReg and Optuna-100 XGBoost heads (Qwen and Gemma 4, standalone and merged)
research_question: >-
  When the model input is text only, how do native transcripts compare with
  English-translated transcripts for LogReg and Optuna-100 XGBoost heads on
  hidden states of Qwen and Gemma 4 backbones, under standalone and merged
  five-dataset training, across three backbone-training seeds? English means
  D3TEC, Androids, CMDC, and Turkish use their complete accepted English
  translation caches while DAIC stays in its original English.
dataset: >-
  Standalone: d3tec, androids_interview, cmdc, turkish (t17). Merged:
  daic + d3tec + androids_interview + cmdc + turkish (exactly five components).
baseline: >-
  Native-transcript condition: every dataset uses its native transcript recipe
  from canonical configs/main harmonized text-only configs.
treatment: >-
  English-transcript condition: the four non-English datasets use the canonical
  _en text-only configs backed by the harmonized_en_complete_v1 accepted caches;
  DAIC remains original English. Same folds, same split seed, same head seeds.
expected_seeds: [7, 1337, 2024]
expected_folds: [0, 1, 2, 3, 4]
primary_metric:
  namespace: headline/binary_strict
  name: macro_f1
  backend: original_teacher_forced
  aggregation: subject_level
  evaluation_view: harmonized_all_windows_full_coverage
secondary_metrics:
  - namespace: headline/binary_strict
    name: positive_f1
    backend: original_teacher_forced
    aggregation: subject_level
    evaluation_view: harmonized_all_windows_full_coverage
modality: text_only
backbones:
  - qwen
  - gemma4
transcript_conditions:
  native: each dataset uses its native transcript language
  english: >-
    D3TEC, Androids, CMDC, and Turkish translated via complete accepted
    harmonized_en_complete_v1 caches; DAIC original English; no DAIC
    translation config exists or may be created
seed_policy:
  training_seeds: [7, 1337, 2024]
  split_seed_standalone: 1337
  split_seed_merged_key: protocol_settings.split_seed
  split_seed_merged_value: 1337
  head_seed_logreg: 1337
  head_xgb_sampler_seed: 1337
  head_xgb_model_seed: 1337
  head_xgb_inner_cv_seed: 1337
  merged_head_fixed_seed_key: heads.fixed_seed
  merged_head_fixed_seed_value: 1337
head_protocols:
  logreg:
    search: none
    standalone_backends:
      qwen: qwen_hidden_logreg_raw
      gemma4: gemma4_hidden_logreg_raw
    merged_backends:
      qwen: qwen_hidden_logreg_raw_symmetric_merged
      gemma4: gemma4_hidden_logreg_raw_symmetric_merged
  xgboost_optuna100:
    trials: exactly 100 completed under profile harmonized_optuna100_v1
    inner_folds: 3
    threshold: 0.5
    sampling_mode: none
    search_space_source: src/features/optuna100_policy.py
    standalone_backends:
      qwen: qwen_hidden_xgb_optuna100
      gemma4: gemma4_hidden_xgb_optuna100
    merged_backends:
      qwen: qwen_hidden_xgb_optuna100_symmetric_merged
      gemma4: gemma4_hidden_xgb_optuna100_symmetric_merged
endpoints:
  primary: merged five-dataset cross-validation strict macro-F1
  supporting:
    - standalone per-dataset results
    - final merged model evaluated on canonical DAIC full-coverage teacher-forced view
evaluation_rules:
  checkpoint_role: best_model
  sample_prediction_mode: original_teacher_forced
  headline_metrics: headline/binary_strict macro_f1 and positive_f1; INVALID counts as wrong
  forbidden: teacher-forced AUROC must not be reported
aggregation_conventions:
  standalone_d3tec_androids: pool five outer folds at subject level per seed; mean and sample sd across seeds; paired EN-minus-native deltas within each seed
  standalone_cmdc_turkish: unweighted mean of five fold scores per seed; Turkish outer fold is train_val selection-and-report, not a held-out test
  merged_cv: per fold unweighted mean of five dataset metrics, then mean across folds per seed; never subject-count-weighted
  merged_final_daic: canonical DAIC full-coverage teacher-forced view per seed
  cross_seed: arithmetic mean, sample standard deviation, paired deltas within matched seeds
job_shapes:
  standalone_train: 1 node x 4 tasks x 4 H100 (DDP), scripts/run_train_slurm.sh
  standalone_eval: 1 node x 1 task x 1 H100, scripts/run_eval_slurm.sh
  hidden_extract: 1 GPU, scripts/run_qwen_hidden_extract_slurm.sh or run_gemma4_hidden_extract_slurm.sh
  heads_and_optuna: CPU-only workers; Optuna-100 uses run_optuna100_slurm.sh with TARGET_TRIALS=100
  merged_train: 1 node x 4 tasks x 4 H100, scripts/run_symmetric_merged_train_slurm.sh
  merged_postprocess: 1 GPU, scripts/run_symmetric_merged_postprocess_slurm.sh
  merged_head: CPU-only, scripts/run_symmetric_merged_head_slurm.sh
planned_matrix:
  standalone_panels: 2 conditions x 2 backbones x 3 seeds = 12 panels x 80 jobs = 960 jobs
  merged_cv: 12 panels x 5 folds x (train + postprocess + head + optuna100) = 240 jobs
  merged_final: 12 panels x (train + postprocess + head + optuna100) = 48 jobs
  smoke: 32 jobs (16 standalone panels x representative routes + 16 merged) with two-trial Optuna resumability smoke
  note: planning assertions only; dry-run expansion must reconcile before production submission
output_prefixes:
  standalone_native_qwen: output_model/text_heads_native_v1/text_only/<dataset>/<run_name>/fold_<n>
  standalone_native_gemma4: output_model/text_heads_native_gemma4_v1/text_only/<dataset>/<run_name>/fold_<n>
  standalone_english_qwen: output_model/text_heads_en_v1/text_only/<dataset>/<run_name>/fold_<n>
  standalone_english_gemma4: output_model/text_heads_en_gemma4_v1/text_only/<dataset>/<run_name>/fold_<n>
  merged_native_qwen_run_root: output_model/symmetric_merged/native_en_text_heads_v1/native_qwen_text_only
  merged_native_gemma4_run_root: output_model/symmetric_merged/native_en_text_heads_v1/native_gemma4_text_only
  merged_english_qwen_run_root: output_model/symmetric_merged/native_en_text_heads_v1/english_qwen_text_only
  merged_english_gemma4_run_root: output_model/symmetric_merged/native_en_text_heads_v1/english_gemma4_text_only
  hidden_features_root: outputs/hidden_classifiers/<dataset>/<condition>/<run_name>/fold_<n> (exact per-attempt paths recorded in each attempt contract)
configs:
  standalone_native_qwen:
    d3tec: configs/main/d3tec_text_only_harmonized_selmacrof1_tf.yaml
    androids_interview: configs/main/androids_text_only_harmonized_selmacrof1_tf.yaml
    cmdc: configs/main/cmdc_text_only_harmonized_selmacrof1_tf.yaml
    turkish: configs/main/turkish_t17_text_only_harmonized_selmacrof1_tf_qwen3asr.yaml
  standalone_english_qwen:
    d3tec: configs/main/d3tec_text_only_harmonized_selmacrof1_tf_en.yaml
    androids_interview: configs/main/androids_text_only_harmonized_selmacrof1_tf_en.yaml
    cmdc: configs/main/cmdc_text_only_harmonized_selmacrof1_tf_en.yaml
    turkish: configs/main/turkish_t17_text_only_harmonized_selmacrof1_tf_qwen3asr_en.yaml
  standalone_native_gemma4:
    d3tec: configs/main/d3tec_text_only_harmonized_selmacrof1_tf_gemma4_12b.yaml
    androids_interview: configs/main/androids_text_only_harmonized_selmacrof1_tf_gemma4_12b.yaml
    cmdc: configs/main/cmdc_text_only_harmonized_selmacrof1_tf_gemma4_12b.yaml
    turkish: configs/main/turkish_t17_text_only_harmonized_selmacrof1_tf_qwen3asr_gemma4_12b.yaml
  standalone_english_gemma4:
    d3tec: configs/main/d3tec_text_only_harmonized_selmacrof1_tf_en_gemma4_12b.yaml
    androids_interview: configs/main/androids_text_only_harmonized_selmacrof1_tf_en_gemma4_12b.yaml
    cmdc: configs/main/cmdc_text_only_harmonized_selmacrof1_tf_en_gemma4_12b.yaml
    turkish: configs/main/turkish_t17_text_only_harmonized_selmacrof1_tf_qwen3asr_en_gemma4_12b.yaml
  merged_native_qwen: configs/experiments/merged/symmetric_merged_text_heads_native_qwen.yaml
  merged_native_gemma4: configs/experiments/merged/symmetric_merged_text_heads_native_gemma4.yaml
  merged_english_qwen: configs/experiments/merged/symmetric_merged_text_heads_english_qwen.yaml
  merged_english_gemma4: configs/experiments/merged/symmetric_merged_text_heads_english_gemma4.yaml
smoke_gate: all 32 smoke jobs terminal COMPLETED 0:0, sidecars consistent, two-trial Optuna rerun idempotent, no smoke result in production workbook
production_gate: dry-run expansion reconciled to planned matrix or journaled orchestration-only difference before submission
completion_conditions:
  - implementation PR merged; production SHA committed clean, deployed immutably, verified
  - remote preflight passed with hashed audit artifact
  - smoke passed
  - all planned production cells submitted with unique tracked identities and monitored to terminal state
  - successful cells collected, locally validated, REPORTABLE via official tools
  - failed/cancelled attempts and retry chains recorded
  - every comparison has three seeds; every XGBoost production cell has exactly 100 completed trials
  - deterministic study JSON/Markdown aggregation reports generated
  - Native vs EN workbook sheet regenerated with 24 summary and 72 seed-detail rows and validated selection
  - approved evidence-first W&B export complete or documented pending
hard_stops:
  - managed create/pin contract cannot be satisfied
  - current source cannot express the locked matrix without changing the scientific question
  - a required translation cache is incomplete or contains fallback/failed records
  - native and English pairs differ in subject/label/split membership
  - Qwen and Gemma 4 cannot be paired under the same scientific recipe
  - dirty production source or failed deployment verification
  - output/context/run/attempt collisions
  - missing or ambiguous evaluation qualifiers
  - missing local compact evidence or non-recomputable result
  - wrong checkpoint/view/aggregation/backend/split-seed/head-seed/trial-count in any cell
  - job expansion differs from locked matrix without an orchestration-only explanation
  - deterministic failure requiring a scope-changing fix
  - merge needed without a current task-specific journaled autonomy grant
comparison_contract:
  tool: tools/exp.py compare only for identical seed/fold qualifiers; deterministic study summarizer for cross-fold and cross-seed hierarchy
  metric_namespace: headline/binary_strict
  views: harmonized_all_windows_full_coverage (and dataset-appropriate full-coverage views where the canonical config declares one)
  tie_rule: no winner selection; this study reports paired deltas, not competing lanes
exclusions:
  - audio-only experiments
  - audio+text experiments
  - D3TEC-only, Turkish-only, selective, or factorial translation ablations
  - extra backbones, heads, or training seeds
  - Subject-OS experiments
  - fixed non-Optuna XGBoost as a headline comparison
  - the separate mechanism question about converting the multilingual merged corpus into one transcript language to improve DAIC transfer, and any new test designed specifically to answer it
github_issue: null
github_pr: null
