decisions:
- 'File naming applied literally: the _tf token is replaced in place by _likelihood_v1 (e.g. ..._selmacrof1_tf_en.yaml -> ..._selmacrof1_likelihood_v1_en.yaml; ..._selmacrof1_tf_qwen3asr.yaml -> ..._selmacrof1_likelihood_v1_qwen3asr.yaml).'
- The 6 merged tf configs are archived too, because their component paths would otherwise point at moved files; new merged file names append _likelihood_v1 (no _tf token existed).
- 'Archive layout: configs/archive/pre_likelihood_20260917/main/ (82 files) and .../merged/ (6 files), mirroring the source locations.'
- 'Turkish negative-only env-var roots keep their env-var names; the campaign segment inside each default path maps per config: qwen native harmonized_v1 -> harmonized_v1_likelihood, qwen EN harmonized_v1_en
  -> harmonized_v1_en_likelihood, gemma4 turkish_qcond_v1_gemma4_negonly_{native,en} -> turkish_qcond_v1_gemma4_negonly_{native,en}_likelihood. A literal reading (all ten -> harmonized_v1_likelihood) was
  rejected because it would put native and EN runs of the same modality/dataset into one directory.'
- 'merged_root (outputs/symmetric_merged/...) is unchanged per the locked diff list; consequence: likelihood merged report outputs would share that tree with the historical tf merged campaign. A one-line
  flip if the reviewer wants full isolation.'
