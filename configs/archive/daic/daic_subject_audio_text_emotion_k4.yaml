dataset: daic
seed: 1337
dataset_root: ${DAIC_DATASET_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/DAIC-WOZ/preprocessed}
manifest_variant: preprocessed_full_transcript_all_splits
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
model_name_or_path: /gpfs/projects/etur92/ozu647717/models/Qwen2-Audio-7B-Instruct
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests
  split_dir: ${PROJECT_ROOT}/outputs/splits
  run_root: ${PROJECT_ROOT}/output_model/audio_text_emotion/daic
prompt:
  system: You are a clinical expert in depression assessment from speech, transcript, and emotional cues.
  # The interleaved "Audio i: <...>\nEmotional description i: ..." prefix is built
  # programmatically by build_prompt_text (subject emotion mode); the template
  # below is the trailing instruction body only.
  user_template: |-
    {audio_context_block}
    {transcript_block}Based on the speech audio segments, transcript, and emotional descriptions, determine whether the subject is {label_descriptor}.
    {label_instruction}
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: true
  use_text: true
  use_emotion: true
  emotion_cache_path: ${PROJECT_ROOT}/outputs/emotion/daic_secap_en.jsonl
  emotion_on_missing: neutral_fallback
  silence_audio: false
  # Subject-level audio: one example per subject from a FIXED K chunks. Fixed K is
  # required for leakage safety on DAIC: chunk count perfectly encodes the label
  # (non-dep=10, dep=15), so a constant count per subject carries zero label info.
  # Training samples K per epoch; val/test use a deterministic evenly-spaced view.
  # Emotion descriptions are re-rendered per sampled chunk set (training) / baked
  # to the deterministic view (eval) so each description tracks its audio.
  sample_mode: subject_audio
  chunks_per_subject: 4
  max_audio_seconds_per_chunk: 30.0
  transcript_max_chars: 4000
  allow_empty_transcript: false
split:
  mode: fixed
  train_partition: train
  selection_partition: val
  dev_pool_partitions:
    - train
    - val
  outer_folds: 5
  final_eval_partition: test
  inner_val_ratio: 0.2
  seed: 1337
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
audio_adapter:
  enabled: false
  adapter_dim: 512
  dropout: 0.1
  train_projector: false
training:
  num_train_epochs: 20
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 5
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  audio_budget_audit: true
  max_grad_norm: 1.0
  selection_metric: inner_val_macro_f1
  selection_metric_mode: auto
  early_stopping:
    enabled: true
    metric: inner_val_macro_f1
    mode: max
    patience: 3
    min_delta: 0.0
evaluation:
  sample_prediction_mode: original_teacher_forced
  aggregation_level: subject
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
  headline_mode: original_teacher_forced
