dataset: daic
seed: 1337
dataset_root: ${DAIC_DATASET_ROOT:-/media/emre/Backup/AudioLLM/Datasets/DAIC-WOZ}
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
model_name_or_path: /gpfs/projects/etur92/ozu647717/models/Qwen2-Audio-7B-Instruct
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests
  split_dir: ${PROJECT_ROOT}/outputs/splits
  run_root: ${PROJECT_ROOT}/output_model/audio_text/daic
prompt:
  system: You are a psychologist analyzing speech and transcript information for depression screening.
  user_template: |-
    The subject's speech audio is provided.
    The transcript of the subject's speech is:
    {transcript}

    Based on the audio and transcript, determine whether the subject is Depressed or Non-depressed.
    Answer with exactly one label: Depressed or Non-depressed.
  prompt_language: english
labels:
  # Paper output labels are Depressed / Non-depressed.
  label_vocab_version: legacy_english_labels
data:
  use_audio: true
  use_text: true
  silence_audio: false
  # DAIC preprocessing in this repo already uses participant-only chunked audio.
  sample_mode: chunk
  transcript_max_chars: 4000
  allow_empty_transcript: false
split:
  final_eval_partition: dev
  train_partition: train
  # Closest repo approximation to the paper's train-only CV model selection.
  inner_val_ratio: 0.2
  seed: 1337
lora:
  # Paper implementation details: rank=16, alpha=32.
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
training:
  # Paper implementation details: trained for 20 epochs.
  num_train_epochs: 20
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 5
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  max_grad_norm: 1.0
evaluation:
  # Closest stable proxy in this repo to paper-style generative label evaluation.
  sample_prediction_mode: original_teacher_forced
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
  headline_mode: original_teacher_forced
