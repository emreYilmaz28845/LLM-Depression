name: symmetric_merged_audio_text
protocol: symmetric_merged
modality: audio_text
seed: 1337
model_name_or_path: ${AUDIO_MODEL_PATH:-/gpfs/projects/etur92/ozu647717/models/Qwen2-Audio-7B-Instruct}
components:
  - name: daic
    config: configs/main/daic_audio_text_selposf1_tf.yaml
    manifest_path: outputs/manifests/daic_manifest.jsonl
    metadata_path: outputs/splits/daic_manifest_metadata.json
  - name: cmdc
    config: configs/main/cmdc_audio_text_selposf1_tf.yaml
    manifest_path: outputs/manifests/cmdc_manifest.jsonl
    metadata_path: outputs/splits/cmdc_manifest_metadata.json
  - name: turkish
    config: configs/main/turkish_t17_audio_text_selposf1_tf_qwen3asr.yaml
    manifest_path: outputs/manifests_t17_qwen3asr/turkish_manifest.jsonl
    metadata_path: outputs/splits_t17_qwen3asr/turkish_manifest_metadata.json
  - name: d3tec
    config: configs/experiments/d3tec/d3tec_audio_text_normalized.yaml
    manifest_path: outputs/manifests_d3tec/d3tec_manifest.jsonl
    metadata_path: outputs/splits_d3tec/d3tec_manifest_metadata.json
  - name: androids_interview
    config: configs/experiments/androids_interview/androids_interview_audio_text_segment_aligned.yaml
    manifest_path: outputs/manifests_androids_interview/androids_interview_manifest.jsonl
    metadata_path: outputs/splits_androids_interview/androids_interview_manifest_metadata.json
output_dirs:
  merged_root: ${PROJECT_ROOT}/outputs/symmetric_merged/audio_text
  run_root: ${PROJECT_ROOT}/output_model/symmetric_merged/audio_text
protocol_settings:
  outer_folds: 5
  inner_val_ratio: 0.2
  selection_metric: mean_dataset_macro_f1
  selection_metric_mode: max
  head_inner_folds: 3
  threshold: 0.5
  daic_official_test_only: true
training:
  num_train_epochs: 20
  final_epoch_policy: rounded_median_selected_epoch
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  logging_steps: 25
  bf16: true
  gradient_checkpointing: true
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  early_stopping:
    enabled: true
    patience: 3
    min_delta: 0.0
heads:
  fixed_xgb:
    n_estimators: 300
    learning_rate: 0.03
    max_depth: 2
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.25
    reg_alpha: 1.0
    reg_lambda: 10.0
  optuna:
    target_trials: 150
    inner_folds: 3
    seed: 1337
    xgb_threads: 20
    study_name: symmetric_merged_xgb
execution:
  smoke_subjects_per_class: 2
  smoke_head_inner_folds: 2
  smoke_epochs: 1
  smoke_optuna_trials: 2
  qwen_gpus: 4
  postprocess_gpus: 1
  head_cpus: 20
  qwen_time: 72:00:00
  postprocess_time: 48:00:00
  head_time: 12:00:00
