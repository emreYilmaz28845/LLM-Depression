dataset: daic
seed: 1337
protocol_id: daic_participant_speech_packed30_v1
manifest_variant: unprocessed_participant_speech_packed30_v1
dataset_root: ${DAIC_UNPROCESSED_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/DAIC-WOZ/unprocessed}
label_root: ${DAIC_LABEL_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/DAIC-WOZ/minimal_zips}
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
model_name_or_path: ${MODEL_PATH:-/gpfs/projects/etur92/ozu647717/models/Qwen2-Audio-7B-Instruct}
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests_daic_participant_packed30
  split_dir: ${PROJECT_ROOT}/outputs/splits_daic_participant_packed30
  run_root: ${PROJECT_ROOT}/output_model/experiments/daic_participant_packed30_jointk4/audio_text
prompt:
  system: You are a psychologist analyzing speech and transcript information for depression screening.
  user_template: |-
    {audio_context_block}
    {transcript_block}Based on the {decision_basis}, determine whether the subject is {label_descriptor}.
    {label_instruction}
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: true
  use_text: true
  silence_audio: false
  # Joint-K4 on the same runtime participant-only packed30 corpus as v1: one
  # seeded random joint bundle per subject per epoch (joint_random_k, K=4,
  # K=min(4,N) for subject 385), balanced-cover validation/test, mean-one loss
  # weights. The SAME truncated full participant transcript is rendered once
  # per joint prompt (never once per audio placeholder).
  recipe_id: runtime_packed30_joint_random_k4_fullcover_v1
  sample_mode: participant_speech_packed30_joint
  participant_chunk_samples: 480000
  inter_span_silence_samples: 0
  train_chunk_policy: joint_random_k
  train_chunks_per_subject: 4
  eval_chunk_policy: balanced_joint_cover
  eval_chunks_per_subject: 4
  loss_weight_rescale: mean_one
  equal_row_weight: false
  audio_text_transcript_scope: full_participant
  transcript_max_chars: 4000
  allow_empty_transcript: false
split:
  mode: fixed
  train_partition: train
  selection_partition: val
  dev_pool_partitions:
    - train
  outer_folds: 5
  final_eval_partition: test
  inner_val_ratio: 0.2
  seed: 1337
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
audio_adapter:
  enabled: false
  adapter_dim: 512
  dropout: 0.1
  train_projector: false
training:
  num_train_epochs: 20
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  # Rank-0-only per-epoch selection evaluation (445 balanced-cover val
  # bundles, ~12 min) exceeds torch's default 600s NCCL watchdog timeout on
  # 4-GPU training; pre-initialize the process group with this timeout.
  dist_timeout_minutes: 60
  logging_steps: 5
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  audio_budget_audit: true
  max_grad_norm: 1.0
  class_balance: none
  selection_metric: inner_val_positive_f1
  selection_metric_mode: max
  early_stopping:
    enabled: true
    metric: inner_val_positive_f1
    mode: max
    patience: 3
    min_delta: 0.0
evaluation:
  sample_prediction_mode: original_teacher_forced
  headline_mode: original_teacher_forced
  aggregation_level: subject
  subject_score_aggregation: mean_score
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
