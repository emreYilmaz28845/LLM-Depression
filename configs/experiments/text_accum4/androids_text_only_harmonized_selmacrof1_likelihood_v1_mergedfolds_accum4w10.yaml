# Standalone text variant for small corpora (user + advisor approved 2026-10-20; full rerun approved 2026-10-21).
# Identical to configs/experiments/androids_mergedfolds/androids_text_only_harmonized_selmacrof1_likelihood_v1_mergedfolds.yaml except training.gradient_accumulation_steps 32 -> 4,
# training.warmup_ratio 0.03 -> 0.1 and training.target_effective_global_batch_size: 16
# (4 ranks x per-device batch 1 x accumulation 4). Needs the update-counted LR schedule.
# Androids Interview standalone rerun on the merged-protocol folds.
# Identical to configs/main/androids_text_only_harmonized_selmacrof1_likelihood_v1.yaml except the two split.locked_folds_* keys.
dataset: androids_interview
seed: 1337
recipe_id: harmonized_full_transcript_single30_allwindows_selmacrof1_likelihood_v1_promptcontext_v1
dataset_root: ${ANDROIDS_DATASET_ROOT:-/media/emre/Backup/AudioLLM/Datasets/Androids-Corpus/Androids-Corpus}
full_transcript_path: ${ANDROIDS_INTERVIEW_FULL_TRANSCRIPTS:-/media/emre/Backup/AudioLLM/Datasets/Androids-Corpus/Androids-Corpus/interview_transcripts_qwen3_asr_italian.jsonl}
segment_transcript_path: ${ANDROIDS_INTERVIEW_SEGMENT_TRANSCRIPTS:-/media/emre/Backup/AudioLLM/Datasets/Androids-Corpus/Androids-Corpus/interview_transcripts_qwen3_asr_italian_segments.jsonl}
model_name_or_path: ${QWEN38_MODEL_PATH:-/gpfs/projects/etur92/ozu647717/models/Qwen3.8-27B}
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests_harmonized/androids
  split_dir: ${PROJECT_ROOT}/outputs/splits_harmonized/androids
  run_root: ${PROJECT_ROOT}/output_model/promptcontext_v1_qwen38_likelihood/text_only/androids_interview
prompt:
  version: promptcontext_v1
  dataset_context: androids
  user_template: '{audio_context_block}

    {transcript_block}Based on the {decision_basis}, determine whether the subject is {label_descriptor}.

    {label_instruction}'
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: false
  use_text: true
  sample_mode: harmonized_response_windows
  segment_seconds: 30.0
  segment_partition: equal_duration
  audio_text_transcript_scope: full_subject
  train_chunk_policy: none
  eval_chunk_policy: subject
  transcript_max_chars: 0
  allow_empty_transcript: false
split:
  mode: cv
  cv_protocol: train_val_test
  outer_folds: 5
  inner_val_ratio: 0.2
  seed: 1337
  locked_folds_path: ${ANDROIDS_MERGED_LOCKED_FOLDS_PATH:-/gpfs/projects/etur92/ozu647717/AudioLLM/experiment_runtime/qwen3-androids-mergedfolds-20261015/inputs/androids_merged_folds_v1.json}
  locked_folds_sha256: 4e15cbbf35e6d426b17fd0c8020830a2ccefed421662de8800556553b331b46b
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: ^model\.language_model\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))$
training:
  dist_timeout_minutes: 120
  num_train_epochs: 20
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  target_effective_global_batch_size: 16
  logging_steps: 25
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  class_balance: none
  selection_metric: inner_val_macro_f1
  selection_metric_mode: max
  early_stopping:
    enabled: true
    metric: inner_val_macro_f1
    mode: max
    patience: 3
    min_delta: 0.0
  strategy: fsdp
  activation_offload: cpu
evaluation:
  sample_prediction_mode: likelihood
  headline_mode: likelihood
  aggregation_level: subject
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
  evaluate_last_checkpoint: false
  evaluation_view: harmonized_all_windows_full_coverage
  inference_dtype: bf16
model_backend: qwen38
model_revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
