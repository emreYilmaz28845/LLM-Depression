dataset: cmdc
seed: 1337
dataset_root: ${CMDC_DATASET_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/CMDC}
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
model_name_or_path: /gpfs/projects/etur92/ozu647717/models/Qwen2-Audio-7B-Instruct
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests_en/cmdc
  split_dir: ${PROJECT_ROOT}/outputs/splits_en/cmdc
  run_root: ${PROJECT_ROOT}/output_model_en/audio_only/cmdc
prompt:
  system: You are a psychologist analyzing speech audio for depression screening.
  user_template: '{audio_context_block}

    {transcript_block}Based on the {decision_basis}, determine whether the subject
    is {label_descriptor}.

    {label_instruction}'
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: true
  use_text: false
  silence_audio: false
  sample_mode: response
  transcript_max_chars: 4000
  allow_empty_transcript: false
split:
  outer_folds: 5
  inner_val_ratio: 0.2
  seed: 1337
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
training:
  num_train_epochs: 3
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 5
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  selection_metric: inner_val_positive_f1
  selection_metric_mode: max
  early_stopping:
    enabled: true
    metric: inner_val_positive_f1
    mode: max
    patience: 3
    min_delta: 0.0
evaluation:
  sample_prediction_mode: original_teacher_forced
  aggregation_level: subject
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
  headline_mode: original_teacher_forced
transcripts:
  variant: english
  cache_path: ${TRANSLATION_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/translations}/qwen36_27b_bf16_clinical_v1/cmdc/accepted.jsonl
  minimum_status: automatic_high
  require_complete: true
