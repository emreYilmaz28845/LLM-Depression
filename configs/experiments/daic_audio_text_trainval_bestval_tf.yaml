# DAIC train+val protocol: train on the AVEC train partition, select on the
# dev (val) partition, and report the BEST val results (the selected epoch's
# full val metrics land in eval/best_validation and summarize_runs scores the
# run from them). Enabled by the opt-in switch split.fixed_protocol: train_val;
# no test partition is ever evaluated. final_eval_partition below is manifest
# bookkeeping only. Everything outside `split`/output dirs matches
# configs/main/daic_audio_text_selposf1_tf.yaml.
dataset: daic
seed: 1337
dataset_root: ${DAIC_DATASET_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/DAIC-WOZ/preprocessed}
manifest_variant: preprocessed_full_transcript_all_splits
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
model_name_or_path: /gpfs/projects/etur92/ozu647717/models/Qwen2-Audio-7B-Instruct
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests_daic_trainval
  split_dir: ${PROJECT_ROOT}/outputs/splits_daic_trainval
  run_root: ${PROJECT_ROOT}/output_model/experiments/daic_trainval_bestval/audio_text
prompt:
  system: You are a psychologist analyzing speech and transcript information for depression screening.
  user_template: |-
    {audio_context_block}
    {transcript_block}Based on the {decision_basis}, determine whether the subject is {label_descriptor}.
    {label_instruction}
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: true
  use_text: true
  silence_audio: false
  # Subject-level audio: one example per subject from a FIXED K chunks. Fixed K is
  # required for leakage safety on DAIC: chunk count perfectly encodes the label
  # (non-dep=10, dep=15), so a constant count per subject carries zero label info.
  # Training samples K per epoch; val/test use a deterministic evenly-spaced view.
  sample_mode: subject_audio
  chunks_per_subject: 4
  max_audio_seconds_per_chunk: 30.0
  transcript_max_chars: 4000
  allow_empty_transcript: false
split:
  mode: fixed
  fixed_protocol: train_val
  train_partition: train
  selection_partition: val
  dev_pool_partitions:
    - train
  outer_folds: 5
  final_eval_partition: val
  inner_val_ratio: 0.2
  seed: 1337
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
audio_adapter:
  enabled: false
  adapter_dim: 512
  dropout: 0.1
  train_projector: false
training:
  num_train_epochs: 20
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 5
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  audio_budget_audit: true
  max_grad_norm: 1.0
  selection_metric: inner_val_positive_f1
  selection_metric_mode: max
  early_stopping:
    enabled: true
    metric: inner_val_positive_f1
    mode: max
    patience: 3
    min_delta: 0.0
evaluation:
  sample_prediction_mode: original_teacher_forced
  aggregation_level: subject
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
  headline_mode: original_teacher_forced
