# Joint-training component (docs/JOINT_CMDC_DAIC_PLAN.md): consumed by the
# daic_cmdc_*_joint_tf.yaml primaries via joint_train.extra_datasets (auxiliary
# CMDC training pool = fold-k outer train) and by the post-hoc holdout eval
# (src.evaluate --config <this> --checkpoint_dir <joint best_model> --fold k).
# Split-identical to the corresponding configs/main/cmdc_*_selposf1_tf.yaml
# (shares outputs/manifests + outputs/splits). Not meant to be trained directly.
dataset: cmdc
seed: 1337
dataset_root: ${CMDC_DATASET_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/CMDC}
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
model_name_or_path: ${TEXT_MODEL_PATH:-/gpfs/projects/etur92/ozu647717/models/Qwen2-7B-Instruct}
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests
  split_dir: ${PROJECT_ROOT}/outputs/splits
  run_root: ${PROJECT_ROOT}/output_model/experiments/joint_daic_cmdc/cmdc_component_text_only
prompt:
  system: You are a psychologist analyzing transcript information for depression screening.
  user_template: |-
    {audio_context_block}
    {transcript_block}Based on the {decision_basis}, determine whether the subject is {label_descriptor}.
    {label_instruction}
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: false
  use_text: true
  silence_audio: false
  sample_mode: response
  transcript_max_chars: 4000
  allow_empty_transcript: false
split:
  outer_folds: 5
  inner_val_ratio: 0.2
  seed: 1337
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
training:
  num_train_epochs: 3
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 5
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  # Aligned recipe: positive-F1 selection + teacher-forced eval.
  selection_metric: inner_val_positive_f1
  selection_metric_mode: max
  early_stopping:
    enabled: true
    metric: inner_val_positive_f1
    mode: max
    patience: 3
    min_delta: 0.0
evaluation:
  sample_prediction_mode: original_teacher_forced
  aggregation_level: subject
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
  headline_mode: original_teacher_forced
