# Joint CMDC+DAIC training (docs/JOINT_CMDC_DAIC_PLAN.md): one model trained on
# DAIC train (107 subj) + CMDC fold-k outer train (~62 subj, all utterances).
# Real joint protocol: train on DAIC train chunks + CMDC fold-k outer-train
# utterances, select on mean(DAIC val positive-F1, CMDC inner-val positive-F1),
# and keep CMDC fold-k holdout for final evaluation only. Class balancing over
# the combined set is switchable:
# training.class_balance resolves from ${JOINT_CLASS_BALANCE:-weighted_sampler}
# (export JOINT_CLASS_BALANCE=none at submit time to disable, or override with
# --set training.class_balance=none). Otherwise identical to the main config.
dataset: daic
seed: 1337
dataset_root: ${DAIC_DATASET_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/DAIC-WOZ/preprocessed}
manifest_variant: preprocessed_full_transcript_all_splits
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
model_name_or_path: /gpfs/projects/etur92/ozu647717/models/Qwen2-Audio-7B-Instruct
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests
  split_dir: ${PROJECT_ROOT}/outputs/splits
  run_root: ${PROJECT_ROOT}/output_model/experiments/joint_daic_cmdc/audio_text
prompt:
  system: You are a psychologist analyzing speech and transcript information for depression screening.
  user_template: |-
    {audio_context_block}
    {transcript_block}Based on the {decision_basis}, determine whether the subject is {label_descriptor}.
    {label_instruction}
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: true
  use_text: true
  silence_audio: false
  # Joint training uses true DAIC segment instances: one preprocessed 30s chunk
  # per example. Evaluation can be switched between segment and subject via
  # evaluation.aggregation_level.
  sample_mode: response
  max_audio_seconds_per_chunk: 30.0
  transcript_max_chars: 4000
  allow_empty_transcript: false
split:
  mode: fixed
  train_partition: train
  selection_partition: val
  dev_pool_partitions:
    - train
    - val
  outer_folds: 5
  final_eval_partition: test
  inner_val_ratio: 0.2
  seed: 1337
joint_train:
  selection_mode: mean_positive_f1
  extra_datasets:
    - config: ${PROJECT_ROOT}/configs/experiments/joint/cmdc_component_audio_text.yaml
      fold: ${JOINT_CMDC_FOLD:-0}
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
audio_adapter:
  enabled: false
  adapter_dim: 512
  dropout: 0.1
  train_projector: false
training:
  num_train_epochs: 20
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 5
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  audio_budget_audit: true
  max_grad_norm: 1.0
  class_balance: ${JOINT_CLASS_BALANCE:-weighted_sampler}
  selection_metric: joint_val_positive_f1
  selection_metric_mode: max
  early_stopping:
    enabled: true
    metric: joint_val_positive_f1
    mode: max
    patience: 3
    min_delta: 0.0
evaluation:
  # Positive-F1 SELECTION (see training.selection_metric) + teacher-forced test verdict.
  # Read headline/binary_strict_* (INVALID counted as wrong); ignore valid_only_*.
  sample_prediction_mode: original_teacher_forced
  aggregation_level: subject
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
  headline_mode: original_teacher_forced
