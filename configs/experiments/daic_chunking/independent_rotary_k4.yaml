dataset: daic
seed: 1337
dataset_root: ${DAIC_DATASET_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/DAIC-WOZ/preprocessed}
manifest_variant: preprocessed_full_transcript_all_splits
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
model_name_or_path: /gpfs/projects/etur92/ozu647717/models/Qwen2-Audio-7B-Instruct
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/daic_chunking/manifests_rotary
  split_dir: ${PROJECT_ROOT}/outputs/daic_chunking/splits_rotary
  run_root: ${PROJECT_ROOT}/output_model/daic_chunking/independent_rotary_k4
prompt:
  system: You are a psychologist analyzing speech audio for depression screening.
  user_template: |-
    {audio_context_block}
    Based on the {decision_basis}, determine whether the subject is {label_descriptor}.
    {label_instruction}
  prompt_language: english
labels: {label_vocab_version: legacy_english_labels}
data:
  use_audio: true
  use_text: false
  silence_audio: false
  sample_mode: subject_chunks
  train_chunk_policy: rotary_k
  train_chunks_per_subject: 4
  eval_chunk_policy: all
  eval_chunks_per_subject: all
  max_audio_seconds_per_chunk: 30.0
  transcript_max_chars: 0
  allow_empty_transcript: false
split: {mode: fixed, train_partition: train, selection_partition: val, dev_pool_partitions: [train, val], final_eval_partition: test, inner_val_ratio: 0.2, seed: 1337}
lora: {rank: 16, alpha: 32, dropout: 0.05, bias: none, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
audio_adapter: {enabled: false, adapter_dim: 512, dropout: 0.1, train_projector: false}
training:
  num_train_epochs: 20
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  match_joint_optimizer_updates: true
  joint_reference_gradient_accumulation_steps: 8
  logging_steps: 20
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  audio_budget_audit: true
  max_grad_norm: 1.0
  selection_metric: inner_val_positive_f1
  selection_metric_mode: max
  early_stopping: {enabled: true, metric: inner_val_positive_f1, mode: max, patience: 3, min_delta: 0.0}
evaluation: {sample_prediction_mode: original_teacher_forced, aggregation_level: subject, subject_score_aggregation: mean_score, generation_max_new_tokens: 8, num_beams: 1, do_sample: false, headline_mode: original_teacher_forced}
