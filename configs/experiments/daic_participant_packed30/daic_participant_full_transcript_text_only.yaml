dataset: daic
seed: 1337
protocol_id: daic_participant_speech_packed30_v1
manifest_variant: unprocessed_participant_speech_packed30_v1
dataset_root: ${DAIC_UNPROCESSED_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/DAIC-WOZ/unprocessed}
label_root: ${DAIC_LABEL_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/DAIC-WOZ/minimal_zips}
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
model_name_or_path: ${TEXT_MODEL_PATH:-/gpfs/projects/etur92/ozu647717/models/Qwen2-7B-Instruct}
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests_daic_participant_packed30
  split_dir: ${PROJECT_ROOT}/outputs/splits_daic_participant_packed30
  run_root: ${PROJECT_ROOT}/output_model/experiments/daic_participant_packed30/text_only
prompt:
  system: You are a psychologist analyzing transcript information for depression screening.
  user_template: |-
    {audio_context_block}
    {transcript_block}Based on the {decision_basis}, determine whether the subject is {label_descriptor}.
    {label_instruction}
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: false
  use_text: true
  silence_audio: false
  # v1 text-only condition: exactly one example per subject using the
  # de-duplicated full participant transcript (never one per audio chunk).
  sample_mode: subject
  transcript_max_chars: 4000
  allow_empty_transcript: false
split:
  mode: fixed
  train_partition: train
  selection_partition: val
  dev_pool_partitions:
    - train
  outer_folds: 5
  final_eval_partition: test
  inner_val_ratio: 0.2
  seed: 1337
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
audio_adapter:
  enabled: false
  adapter_dim: 512
  dropout: 0.1
  train_projector: false
training:
  num_train_epochs: 20
  learning_rate: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 5
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  class_balance: none
  selection_metric: inner_val_positive_f1
  selection_metric_mode: max
  early_stopping:
    enabled: true
    metric: inner_val_positive_f1
    mode: max
    patience: 3
    min_delta: 0.0
evaluation:
  sample_prediction_mode: original_teacher_forced
  headline_mode: original_teacher_forced
  aggregation_level: subject
  subject_score_aggregation: mean_score
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
