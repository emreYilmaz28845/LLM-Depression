dataset: turkish
dataset_variant: pooled_t17
seed: 1337
recipe_id: harmonized_full_transcript_single30_allwindows_selmacrof1_likelihood_qcond_v1_promptcontext_v1
model_backend: qwen3omni
model_name_or_path: ${QWEN3_OMNI_MODEL_PATH:-/gpfs/projects/etur92/ozu647717/models/Qwen3-Omni-30B-A3B-Instruct}
model_attn_implementation: sdpa
dataset_root: pooled_source_manifests
metadata_csv: pooled_source_manifest_rows
transcript_file: pooled_source_manifest_transcripts
threshold: 17
metadata_schema: pooled_t17_source_manifest
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
manifest_policy: prebuilt
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests_harmonized/turkish_pooled_t17_qwen3asr
  split_dir: ${PROJECT_ROOT}/outputs/splits_harmonized/turkish_pooled_t17_qwen3asr
  run_root: ${PROJECT_ROOT}/output_model/promptcontext_v1_qwen3omni_likelihood/audio_text/turkish
prompt:
  version: promptcontext_v1
  dataset_context: turkish_pooled
  question_context_version: promptcontext_v1
  user_template: |-
    {audio_context_block}
    {question_context}
    {transcript_block}Based on the {decision_basis}, determine whether the subject is {label_descriptor}.
    {label_instruction}
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: true
  use_text: true
  silence_audio: false
  sample_mode: harmonized_response_windows
  segment_seconds: 30.0
  segment_partition: equal_duration
  audio_text_transcript_scope: full_subject
  train_chunk_policy: all_windows_hierarchical_weighted
  eval_chunk_policy: all_windows
  transcript_max_chars: 0
  allow_empty_transcript: false
split:
  mode: cv
  cv_protocol: train_val
  outer_folds: 5
  inner_val_ratio: 0.2
  seed: 1337
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: ^model\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))$
audio_adapter:
  enabled: false
  adapter_dim: 512
  dropout: 0.1
  train_projector: false
training:
  dist_timeout_minutes: 120
  strategy: fsdp
  activation_offload: cpu
  num_train_epochs: 20
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  logging_steps: 25
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  audio_budget_audit: true
  max_grad_norm: 1.0
  class_balance: none
  selection_metric: inner_val_macro_f1
  selection_metric_mode: max
  early_stopping:
    enabled: true
    metric: inner_val_macro_f1
    mode: max
    patience: 3
    min_delta: 0.0
evaluation:
  sample_prediction_mode: likelihood
  headline_mode: likelihood
  aggregation_level: response_subject
  hierarchical_score_aggregation: mean
  evaluation_view: harmonized_all_windows_full_coverage
  inference_dtype: bf16
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
  evaluate_last_checkpoint: false
resources:
  eval_nodes: 1
  eval_gpus_per_node: 4
