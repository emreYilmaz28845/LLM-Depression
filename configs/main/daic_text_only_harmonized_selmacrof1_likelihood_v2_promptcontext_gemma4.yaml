dataset: daic
seed: 1337
recipe_id: harmonized_full_transcript_single30_allwindows_selmacrof1_likelihood_v2_promptcontext_v1
protocol_id: daic_participant_speech_packed30_v1
manifest_variant: unprocessed_participant_speech_packed30_v1
dataset_root: ${DAIC_UNPROCESSED_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/DAIC-WOZ/unprocessed}
label_root: ${DAIC_LABEL_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/DAIC-WOZ/minimal_zips}
model_name_or_path: ${GEMMA4_MODEL_PATH:-/gpfs/projects/etur92/ozu647717/models/gemma-4-12B-it/707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7}
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests_harmonized/daic
  split_dir: ${PROJECT_ROOT}/outputs/splits_harmonized/daic
  run_root: ${PROJECT_ROOT}/output_model/promptcontext_v1_gemma4_likelihood/text_only/daic
prompt:
  system: |-
    You are classifying a participant's depression study label from the provided speech audio and/or transcript. Use the recording context below to interpret the input. Possible relevant signs include persistent low mood, loss of interest, hopelessness, and changes in sleep or energy. A question's topic, a single phrase, or one vocal feature is not conclusive. The label belongs to the participant, even when the input is only one recording or audio window. Make a research label prediction, not a clinical diagnosis.

    Recording context: This is an English semi-structured interview with the virtual interviewer Ellie. It mixes everyday conversation with questions about mood, sleep, diagnosis, and treatment. The audio is a short window of participant speech; if a transcript is provided, it can cover more of the participant's session than the audio. The study uses a PHQ-8 binary label associated with a threshold of 10.
  user_template: |-
    {audio_context_block}
    {transcript_block}Based on the {decision_basis}, determine whether the subject is {label_descriptor}.
    {label_instruction}
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: false
  use_text: true
  sample_mode: participant_speech_packed30
  participant_chunk_samples: 480000
  inter_span_silence_samples: 0
  audio_text_transcript_scope: full_participant
  train_chunk_policy: none
  eval_chunk_policy: subject
  transcript_max_chars: 0
  allow_empty_transcript: false
split:
  mode: fixed
  train_partition: train
  selection_partition: val
  dev_pool_partitions:
  - train
  outer_folds: 5
  final_eval_partition: test
  inner_val_ratio: 0.2
  seed: 1337
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: ^model\.language_model\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))$
training:
  dist_timeout_minutes: 120
  num_train_epochs: 20
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  logging_steps: 25
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: true
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  class_balance: none
  selection_metric: inner_val_macro_f1
  selection_metric_mode: max
  early_stopping:
    enabled: true
    metric: inner_val_macro_f1
    mode: max
    patience: 3
    min_delta: 0.0
evaluation:
  sample_prediction_mode: likelihood
  headline_mode: likelihood
  aggregation_level: subject
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
  evaluate_last_checkpoint: false
  evaluation_view: harmonized_all_windows_full_coverage
model_backend: gemma4
model_revision: 707f0a3b8a3c7ad586ed01e27eafbad8a27dd0f7
