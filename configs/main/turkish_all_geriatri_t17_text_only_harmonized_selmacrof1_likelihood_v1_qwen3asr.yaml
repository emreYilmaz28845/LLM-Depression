dataset: turkish
dataset_variant: all_geriatri_t17
score_authority: metadata_csv
seed: 1337
recipe_id: harmonized_full_transcript_single30_allwindows_selmacrof1_likelihood_v1_promptcontext_v1_all_geriatri
sources:
  - id: original_positive
    cohort: original
    question_condition: pos_only_t17
    dataset_root: ${TURKISH_POS_ONLY_DATASET_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/Turkish_Positive_Only}
    metadata_csv: metadata_turkish_t25_binary_merged.csv
    metadata_schema: legacy_t25
    audio_dir: all-files
    transcript_file: whisper_transcripts_qwen3_asr.jsonl
  - id: original_negative
    cohort: original
    question_condition: negative_only_t17
    dataset_root: ${TURKISH_NEGATIVE_ONLY_DATASET_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/Turkish_Negative_Only}
    metadata_csv: metadata_turkish_negative_only_t17.csv
    metadata_schema: minimal_t17
    audio_dir: .
    transcript_file: whisper_transcripts_qwen3_asr_reviewed.jsonl
  - id: geriatri_positive
    cohort: geriatri
    question_condition: pos_only_t17
    dataset_root: ${TURKISH_GERIATRI_DATASET_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/Turkish_Geriatri}
    metadata_csv: metadata_positive_sample.csv
    metadata_schema: geriatri_bdo_t17
    audio_dir: positive
    transcript_file: whisper_transcripts_qwen3_asr_positive.jsonl
  - id: geriatri_negative
    cohort: geriatri
    question_condition: negative_only_t17
    dataset_root: ${TURKISH_GERIATRI_DATASET_ROOT:-/gpfs/projects/etur92/ozu647717/AudioLLM/Datasets/Turkish_Geriatri}
    metadata_csv: metadata_negative_sample.csv
    metadata_schema: geriatri_bdo_t17
    audio_dir: negative
    transcript_file: whisper_transcripts_qwen3_asr_negative.jsonl
threshold: 17
model_name_or_path: ${QWEN38_MODEL_PATH:-/gpfs/projects/etur92/ozu647717/models/Qwen3.8-27B}
quarantine_path: ${PROJECT_ROOT}/configs/quarantines.yaml
output_dirs:
  manifest_dir: ${PROJECT_ROOT}/outputs/manifests_harmonized/turkish_all_geriatri_t17_qwen3asr
  split_dir: ${PROJECT_ROOT}/outputs/splits_harmonized/turkish_all_geriatri_t17_qwen3asr
  run_root: ${PROJECT_ROOT}/output_model/promptcontext_v1_qwen38_likelihood/text_only/turkish_all_geriatri_t17_qwen3asr
prompt:
  version: promptcontext_v1
  dataset_context: turkish_pooled
  question_context_version: promptcontext_v1
  user_template: '{audio_context_block}

    {transcript_block}Based on the {decision_basis}, determine whether the subject is {label_descriptor}.

    {label_instruction}'
  prompt_language: english
labels:
  label_vocab_version: legacy_english_labels
data:
  use_audio: false
  use_text: true
  sample_mode: harmonized_response_windows
  segment_seconds: 30.0
  segment_partition: equal_duration
  audio_text_transcript_scope: full_subject
  train_chunk_policy: none
  eval_chunk_policy: subject
  transcript_max_chars: 0
  allow_empty_transcript: false
split:
  mode: cv
  cv_protocol: train_val
  outer_folds: 5
  inner_val_ratio: 0.2
  seed: 1337
lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules: ^model\.language_model\.layers\.\d+\.(?:self_attn\.(?:q_proj|k_proj|v_proj|o_proj)|mlp\.(?:gate_proj|up_proj|down_proj))$
training:
  dist_timeout_minutes: 120
  num_train_epochs: 20
  learning_rate: 0.0002
  weight_decay: 0.0
  warmup_ratio: 0.03
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 32
  logging_steps: 25
  bf16: true
  gradient_checkpointing: true
  run_final_eval_in_train: false
  dataloader_num_workers: 0
  max_grad_norm: 1.0
  class_balance: none
  selection_metric: inner_val_macro_f1
  selection_metric_mode: max
  early_stopping:
    enabled: true
    metric: inner_val_macro_f1
    mode: max
    patience: 3
    min_delta: 0.0
  strategy: fsdp
  activation_offload: cpu
evaluation:
  sample_prediction_mode: likelihood
  headline_mode: likelihood
  aggregation_level: subject
  evaluation_view: harmonized_all_windows_full_coverage
  generation_max_new_tokens: 8
  num_beams: 1
  do_sample: false
  evaluate_last_checkpoint: false
  inference_dtype: bf16
model_backend: qwen38
model_revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
